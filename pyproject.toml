[project]
name = "web-download"
version = "0.1.0"
description = "Identify and download protocol PDFs from medical-journal article pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "browser-use>=0.1.40",
    "openai>=1.40",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "patchright>=1.60.1",
    "requests>=2.31",
    "tqdm>=4.66",
    "ipykernel>=7.3.0",
    "polars>=1.41.2",
    "matplotlib>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
web-download = "web_download.cli:main"
search-papers = "search_papers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_download", "src/search_papers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
